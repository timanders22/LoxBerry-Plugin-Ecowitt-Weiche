; Ecowitt-Weiche - Deutsch
;
; Jeder hier benutzte Schluessel muss auch in language_en.ini stehen.
; Jeden Wert in doppelte Anfuehrungszeichen setzen: bei parse_ini_file
; beginnt mit ; ein Kommentar, und jede HTML-Entitaet endet auf ein
; Semikolon. Innerhalb eines Wertes darf kein doppeltes Anfuehrungszeichen
; stehen - HTML-Attribute deshalb einfach quoten: <span class='sm-mono'>.

[ALLGEMEIN]
TITEL = "Ecowitt-Weiche"

[REITER]
EINSTELLUNGEN = "Einstellungen"
LOXONE = "Einbindung in Loxone"
TEST = "Test und Protokoll"

[LEGENDE]
LESEN = "liest nur, ändert nichts"
AKTION = "schreibt die Einstellungen"

[FELD]
OK = "1 = eine Schnittstelle liefert brauchbare Daten"
QUELLE = "0 = keine, 1 = primär, 2 = Ersatz"
WECHSEL = "Wie oft die Weiche seit dem Start umgeschaltet hat"
ALTER = "Sekunden seit den letzten brauchbaren Daten (-1 = noch nie)"

[TEXT]
WARUM = "Eine Ecowitt-Konsole hat oft zwei Netzwerkschnittstellen, LAN und WLAN, unter zwei Adressen. Loxone kann an einem virtuellen HTTP-Eingang aber nur eine davon eintragen. Fällt sie aus, stehen alle daran hängenden Werte auf 0 - und 0 ist in einer Loxone-Logik ein gültiger Messwert, kein Fehler. Dieses Plugin fragt beide Adressen und reicht die Antwort der Schnittstelle durch, die gerade trägt."
H_EINSTELLUNGEN = "Einstellungen"
L_PRIMAER = "Erste Adresse (wird zuerst gefragt)"
H_PRIMAER = "IP oder Hostname der Station, ohne http:// und ohne Pfad. Leer lassen schaltet diese Seite ab."
L_ERSATZ = "Ausweichadresse"
H_ERSATZ = "Die zweite Schnittstelle derselben Station. Wird nur gefragt, wenn die erste keine brauchbaren Daten liefert."
L_PFAD = "Pfad der Abfrage"
H_PFAD = "Bei Ecowitt-Konsolen /get_livedata_info . Gilt für beide Adressen."
L_TIMEOUT = "Wartezeit je Adresse (Sekunden)"
H_TIMEOUT = "Nach dieser Zeit gilt eine Schnittstelle als stumm. Vier Sekunden reichen im Heimnetz; länger verzögert nur die Antwort an Loxone."
L_PRUEFE = "Den Inhalt prüfen, nicht nur die Verbindung"
H_PRUEFE = "Eingeschaltet gilt eine Antwort erst dann als brauchbar, wenn die Außenfeuchte eine Zahl größer null ist. Genau darauf kommt es an: eine Station kann antworten und trotzdem nur Platzhalter liefern. Ausschalten nur, wenn Ihre Station kein Feld 0x07 kennt."
L_TOKEN = "Wortzeichen (Token)"
H_TOKEN = "Wird beim ersten Start selbst erzeugt. Solange hier etwas steht, muss die Loxone-Adresse es mitführen - die Adresse unter Einbindung in Loxone trägt es bereits. Wer das Feld leert und speichert, lässt den Endpunkt ohne Wortzeichen laufen; es wird dann nicht mehr nachgelegt. Danach aber die Adresse in Loxone neu abschreiben, sonst antwortet der Endpunkt weiter mit 403."
SPEICHERN = "Einstellungen speichern"
GESPEICHERT = "Einstellungen gespeichert."
ADRESSE_UNGUELTIG = "Adresse abgewiesen: erlaubt sind nur Buchstaben, Ziffern, Punkt, Bindestrich und Unterstrich, dahinter optional ein Doppelpunkt mit Portnummer. Es wurde nichts gespeichert."
H_LOXONE = "Einbindung in Loxone"
LOX_ERKLAERUNG = "In der Loxone-Projektdatei ändert sich genau eine Stelle: die Adresse des virtuellen HTTP-Eingangs. Alle Suchtexte bleiben unverändert, denn dieses Plugin reicht das JSON der Station wortgetreu durch und stellt nur zwei eigene Felder voran."
LOX_ADRESSE = "Diese Adresse trägt der Behälter"
LOX_ADRESSE_HILFE = "Der Behälter, nicht der einzelne Befehl. Die Abfragezeit bleibt, wie sie war."
LOX_STATUS = "Zusätzlich abfragbar: der Zustand der Weiche"
FELD = "Feld"
BEDEUTUNG = "Bedeutung"
LOX_MINVAL = "Beim Anlegen der Eingänge MinVal und MaxVal so setzen, dass sie den ganzen Bereich tragen. ALTER kann -1 werden; steht dort MinVal 0, macht Loxone daraus eine 0 - und 0 hieße dann fälschlich taufrisch."
H_TEST = "Test und Protokoll"
BEIDE_PRUEFEN = "Beide Adressen jetzt prüfen"
SCHNITTSTELLE = "Schnittstelle"
ADRESSE = "Adresse"
ERGEBNIS = "Ergebnis"
PRIMAER = "erste"
ERSATZ = "Ersatz"
TRAEGT_GERADE = "trägt gerade"
WECHSEL_GESAMT = "Wechsel gesamt"
LETZTE_GUTE = "zuletzt brauchbare Daten"
BRAUCHBAR = "brauchbar"
KEINE_ADRESSE = "keine Adresse hinterlegt"
KEINE_ANTWORT = "keine Antwort"
PROBE_HILFE = "0x02 Temperatur, 0x07 Feuchte, 0x15 Solarstrahlung, 0x17 UV. Stehen dort Striche statt Zahlen, antwortet die Station zwar, hat aber den Funk zum Außensensor verloren."
PROTOKOLL = "Protokoll"
PROTOKOLL_HILFE = "Aufgeschrieben wird nur der Wechsel von einer Schnittstelle zur anderen, nicht jeder Abruf. Eine Minutenabfrage erzeugt sonst 1440 Zeilen am Tag, in denen die eine wichtige untergeht."
PROTOKOLL_LEER = "Noch nichts aufgezeichnet - es hat also noch kein Wechsel stattgefunden."
PRUEFPUNKT = "Prüfung"
GEMESSEN = "gemessen"
H_SELBST = "Selbstprüfung"
SELBST_HILFE = "Gezählt wird in der Datei der Oberfläche selbst. Reiterleiste, Bereiche und Positivliste sind drei Stellen, die dieselben Namen führen müssen - laufen sie auseinander, fällt ein Reiter aus, ohne dass jemand einen Fehler sieht."
S_REITER = "Reiterleiste, Bereiche und Positivliste führen dieselben Namen"
S_ENDPUNKT = "Der Endpunkt für den Miniserver liegt an seinem Platz"
S_SCHREIBBAR = "Die Konfiguration lässt sich schreiben"
S_ADRESSEN = "Mindestens eine Adresse ist hinterlegt"
S_OK = "in Ordnung"
S_NOK = "Befund"
S_NICHT_GEFUNDEN = "nicht gefunden"
TOKEN_NEU = "Wortzeichen neu erzeugen"
TOKEN_WEG = "Wortzeichen entfernen"
TOKEN_ERZEUGT = "Neues Wortzeichen erzeugt. Bitte die Adresse unter Einbindung in Loxone neu abschreiben - die alte antwortet ab sofort mit 403."
TOKEN_ENTFERNT = "Wortzeichen entfernt. Der Endpunkt antwortet jetzt ohne Wortzeichen; die Adresse in Loxone darf keines mehr mitführen."
TOKEN_KNOEPFE = "Speichern lässt das Wortzeichen unberührt, solange das Feld leer ist - ein leeres Feld heißt nicht löschen. Zum Ändern die beiden Knöpfe benutzen oder einen eigenen Wert eintragen und speichern."
