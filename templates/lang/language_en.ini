[BAUSTEIN]
H = "Complete block list for a 1:1 rebuild"
TEXT = "Work through it from top to bottom and the function is rebuilt. Loxone Config finds the blocks via the block search (<b>F5</b>). There is no import template for this plugin: the existing data container keeps all its commands, only its address changes; the status container and the failure detection are added."
