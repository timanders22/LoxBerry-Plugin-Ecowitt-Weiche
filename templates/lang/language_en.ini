[BAUSTEIN]
H = "Step 5: block lists to rebuild 1:1"
TEXT = "Three pages from the LoxBerry plugins sample project; work through each from top to bottom. The values come via MQTT into virtual inputs (steps 1 to 4); Loxone Config finds the other blocks via the block search (<b>F5</b>). Lines “(dropped)” no longer exist in the sample project – the numbers stay so that the list matches."
T_TYP = "Block (type)"
T_NAME = "Name"
T_PARAM = "Parameters"
T_VERB = "Connect inputs to"
ERLAEUTERUNG = "<b>On {B4} and {B28}:</b> {N:status/ok} becomes 0 when both addresses fail or the values of the station have been frozen for 15 minutes. If instead the LoxBerry, the MQTT gateway or the minute run stands still, nothing arrives at all – a virtual input then keeps its last value. Only the sign of life {N:status/zaehler} at the analog value validation {B28} detects that: Tmc 600 s are ten minute runs, single lost messages of the gateway report nothing.<br><b>On {B12}:</b> The notification block only sends on a change from off to on. Never connect several sources directly to its input – combine them with OR ({B10}) first."
BILD_ALT = "Plugin blocks in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
SEITE1_H = "Switch, failure and fallback operation"
SEITE2_H = "Weather values of the station"
SEITE3_H = "Batteries of the sensors"
S1_1 = "In the plugin tab <b>Settings</b> enter the first address (e.g. Wi-Fi of the console) and the fallback address (e.g. LAN) without http://, keep the timeout of 3 s, keep “Check the content” on, save. Tab <b>Test and log</b> → “Check both addresses now”: both lines “usable”."
S1_2 = "Tab <b>MQTT</b>: “Enable MQTT” ticked (on by default for new installations), keep the prefix ecowittweiche, save. The MQTT gateway is set to autostart. After one minute at the latest the header says “minute run (MQTT) – last run …”."
S1_3 = "MQTT gateway as in step 2 above: under version 1 the plugin enters its subscription itself; under version 2 tick the data points of the group ecowittweiche."
S1_4 = "Create the virtual inputs {N:status/ok}, {N:quelle}, {N:wechsel} and {N:status/zaehler} (Periphery → Virtual inputs), names exactly as in the name table above – button “Copy”. Whoever copies the page from the sample project gets them with it."
S1_5 = "Create the page „Ecowitt-Weiche“ and drag the four inputs onto it. Do not create the lines “(dropped)” ({B1} to {B3}, {B7}, {B9}, {B14} to {B16}); the numbers stay so that the list matches the sample project."
S1_6 = "Create three notifications (Periphery → Messages → Notification): „Wetterstation gestört“, „Wetterstation Ausweichadresse“, „Wetterstation Weiche pendelt“, texts as in the table, drag them onto the page. Each gets exactly one connection."
S1_7 = "Place the remaining blocks via the block search (<b>F5</b>), parameters as in the table, connect from top to bottom. Status „Ecowitt-Weiche“: the lines are in the table and are entered by hand, in the given order, the one without condition last. “Pulse at” stays at 00:00:00."
S1_8 = "Analog value validation {B28}: Config creates the input En inverted – remove the tick at ‘En’ in the properties, otherwise the constant 1 arrives as 0 and the message never comes."
S1_9 = "Save and transfer. Check: the status shows “first address carries – today 0 changes”, and {N:status/zaehler} counts on every minute. If you like: briefly disconnect the Wi-Fi at the console – after the next minute run the status shows “fallback address carries”, the message only comes after one hour."
N1_1 = "„Wetterstation gestört“ ({B12}) comes when both addresses fail, when the values freeze and when LoxBerry, MQTT gateway or plugin do not report. It only reports on a change from off to on; the fallback message ({B19}) and the toggling message ({B25}) are therefore separate messages."
N1_2 = "On {B17} to {B19}: the switch re-checks the first address after 10 minutes of fallback operation; the message after one hour means: the first address stays faulty."
N1_3 = "On {B20} to {B25}: {N:wechsel} counts since the installation, „Wechsel heute“ takes out the day. A permanent failure is one change, an unstable reception many. After a restart of the Miniserver „Wechsel heute“ stays at 0 until midnight."
N1_4 = "Via MQTT there is no age: {N:status/ok} reports frozen values with 0 (only if the station delivers its own time stamp). Status container and ALTER belong to the path via HTTP (below, “Existing installations”)."
N1_5 = "With MQTT the plugin asks the station every minute, in addition to every HTTP poll of an old container. Whoever has switched to MQTT completely deletes the old container in Loxone."
S2_1 = "In the Ecowitt app (WS View Plus) set the units of the console to °C, km/h, mm and hPa – a virtual input does not convert."
S2_2 = "Create the virtual inputs {W1} to {W21} and {W40} to {W44}, names exactly as in the table (name table above, button “Copy”), unit, min and max as there. {W40} to {W44} only get a value if your station delivers the field – the tab Test and log names which."
S2_3 = "Create a new page „Ecowitt-Weiche Wetterwerte“ and drag the inputs onto it ({W1} once more onto „Fensterbilanz Messwerte“ if you use Fensterbilanz). For Außentemperatur, Außenfeuchte, Windböe, Solarstrahlung, Regen heute and Luftdruck relativ switch on “Statistics” in the properties."
S2_4 = "Create two notifications: „Wetterstation Sturm“ and „Wetterstation Frost“, texts as in the table."
S2_5 = "Place the remaining blocks via <b>F5</b>, parameters as in the table; the lines of the status blocks are entered by hand, the one without condition last. If a status lacks inputs (V5, V6), click “+” until they are there."
S2_6 = "Save and transfer. Check: compare the values in the app with the Ecowitt app. If Loxone shows about a third for the wind, the console delivers m/s: repeat step 1."
N2_1 = "Missing values: -1 means “no value” (sensor missing or the station delivers dashes), -999 for temperatures, because -1 °C is a real value. The status blocks, the frost ({W38}, {W39}) and the fog ({W34}) catch both; your own logic should do so too."
N2_2 = "Storm 60/45 km/h and frost 1/3 °C are example thresholds; change them as you need."
N2_3 = "Placeholders of other pages: with an Ecowitt you can connect the rain rate {N:regenrate} via a threshold switch (on 0.5 / off 0.2 mm/h) on „Robonect Steuerung“ instead of „Regensensor (eigene Quelle)“, and the solar radiation {N:solar} on „Fensterbilanz Messwerte“ instead of „Globalstrahlung (eigene Quelle)“. Then delete the placeholder – not both."
N2_4 = "An input for which the station delivers nothing (such as {W40} to {W44} without the sensor) never gets a value and stays at 0. The tab Test and log shows which additional fields your station delivers."
S3_1 = "Create the virtual inputs {BAT1} to {BAT7}, names exactly as in the table (name table above, button “Copy”). Only for the sensors you have – without a sensor no value ever comes."
S3_2 = "Create a new page „Ecowitt-Weiche Batterien“, drag the inputs onto it, place the status {BAT8} via <b>F5</b> (click “+” until V7 is there) and enter the lines by hand."
S3_3 = "Save and transfer. Check: the status shows the levels of the sensors; the plugin tab Test and log names which battery fields your station delivers."
N3_1 = "Display only: the page does not evaluate the batteries and reports nothing. A warning threshold (such as level 1 or below) follows once an empty battery has been measured."
N3_2 = "Level 0 to 5 is a level, not a voltage (5 = full). An input without a registered sensor stays at 0 – that looks like “empty”; the status says so."
N3_3 = "Soil sensors (EC, channel 1 and 2) are not on the page: create {N:batterie_ec1}, {N:spannung_ec1}, {N:batterie_ec2} and {N:spannung_ec2} yourself from the name table above if needed."
