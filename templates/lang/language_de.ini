S4_TEXT = "Ein Virtueller Eingang <b>behält seinen letzten Wert</b>, wenn nichts mehr kommt – in der App sieht dann alles normal aus. Deshalb sendet das Plugin jede Minute das Lebenszeichen %s (zählt 0 bis 999 um). Diesen Eingang an eine Analogwertvalidierung legen: Tmc 600 s, Min 0, Max 999, an En die Konstante 1, und im Eigenschaftsfenster den Haken bei ‚En‘ entfernen. Steht der LoxBerry, der Minutenlauf oder das MQTT-Gateway, meldet ihr Ausgang E. %s = 0 heißt: beide Adressen der Station ausgefallen oder ihre Werte eingefroren; %s größer 0 unterscheidet „eingefroren“ von „beide tot“. Ein Alter aus einem Zeitstempel braucht es nicht."
