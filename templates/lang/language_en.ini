WAS_IST_DAS = "<b>One Ecowitt weather station, two network interfaces, one address for Loxone.</b> When the Miniserver calls the switch, it asks the station via the first address and only on an unusable answer via the fallback address, for example LAN and Wi-Fi. Usable means: the outdoor humidity is a number above zero – placeholders such as “---.-” fail. The answer is passed on word for word, with two fields of its own added, to the virtual HTTP input of the Miniserver; if both sides fail, HTTP 503 comes without data, so the failure stays visible."

