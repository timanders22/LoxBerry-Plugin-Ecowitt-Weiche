B13_PARAM = "Lines: V5 = 1 “LoxBerry or plugin does not answer – all weather values are frozen; check LoxBerry and the Ecowitt-Weiche plugin”; V2 = 0 “no usable data – both station addresses failed (for &lt;v3&gt; s); in the plugin tab Test and log ‘Check both addresses now’”; V3 &gt;= 900 “data &lt;v3&gt; s old – the station sends no new values, restart the station”; V1 = 2 “fallback address carries – the first address is faulty; today &lt;v4&gt; changes”; V1 = 1 “first address carries – today &lt;v4&gt; changes”; without condition “no usable data”"
B13_VERB = "V1 = Output of Ecowitt-Weiche Quelle ({B5}), V2 = {B4}, V3 = {B7}, V4 = {B22}, V5 = error output of {B2}"
ERLAEUTERUNG = "<b>On {B1} and {B3}:</b> Set the timeout of both containers to at least the stated value – below it Loxone gives up before the fallback address could answer (see <i>When both addresses fail</i>).<br><b>On {B8} and {B9}:</b> If both addresses fail, {B3} answers with <span class='sm-mono'>OK=0</span> and ALTER keeps counting. If the station freezes, OK stays 1, but ALTER still grows as soon as the station delivers its own time stamp – hence both paths. ALTER = -1 means “never any data” and lies below the off threshold; {B8} catches that case. Keep MinVal of {B7} at -1, otherwise Loxone turns -1 into 0.<br><b>On {B11}:</b> A short switch to the fallback address is no failure; the delay keeps messages away during switching.<br><b>On {B12}:</b> The notification block only sends on a change from off to on. Never connect several sources directly to its input – combine them with OR first.<br><b>If the LoxBerry itself is gone</b>, {B3} does not answer either: Loxone keeps the last values (OK stays 1, ALTER stands still). The error output of the outdoor temperature ({B2}) shows that: it becomes 1 when the container gets no valid value. Hence it goes via the OR {B16} to the same message and to V5 of the status {B13}."
