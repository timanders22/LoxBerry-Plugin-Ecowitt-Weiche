[BAUSTEIN]
H = "Schritt 5: Baustein-Listen zum 1:1-Nachbauen"
TEXT = "Drei Seiten aus dem LoxBerry-Plugins Musterprojekt, jede von oben nach unten abarbeiten. Die Werte kommen über MQTT in Virtuelle Eingänge (Schritte 1 bis 4); die übrigen Bausteine finden sich in Loxone Config über die Baustein-Suche (<b>F5</b>). Zeilen „(entfällt)“ gibt es im Musterprojekt nicht mehr – die Nummern bleiben, damit die Liste passt."
T_TYP = "Baustein (Typ)"
T_NAME = "Name"
T_PARAM = "Parameter"
T_VERB = "Eingänge verbinden mit"
ERLAEUTERUNG = "<b>Zu {B4} und {B28}:</b> {N:status/ok} wird 0, wenn beide Adressen ausfallen oder die Werte der Station seit 15 Minuten eingefroren sind. Steht dagegen der LoxBerry, das MQTT-Gateway oder der Minutenlauf, kommt gar nichts mehr – ein Virtueller Eingang behält dann seinen letzten Wert. Das erkennt nur das Lebenszeichen {N:status/zaehler} an der Analogwertvalidierung {B28}: Tmc 600 s sind zehn Minutenläufe, einzelne verlorene Meldungen des Gateways melden nichts.<br><b>Zu {B12}:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang – erst über ODER ({B10}) zusammenführen."
BILD_ALT = "Bausteine des Plugins in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
SEITE1_H = "Weiche, Ausfall und Ausweichbetrieb"
SEITE2_H = "Wetterwerte der Station"
SEITE3_H = "Batterien der Sensoren"
S1_1 = "Im Plugin Reiter <b>Einstellungen</b> die erste Adresse (z. B. WLAN der Konsole) und die Ausweichadresse (z. B. LAN) ohne http:// eintragen, Wartezeit 3 s lassen, „Den Inhalt prüfen“ an lassen, speichern. Reiter <b>Test und Protokoll</b> → „Beide Adressen jetzt prüfen“: beide Zeilen „brauchbar“."
S1_2 = "Reiter <b>MQTT</b>: „MQTT aktivieren“ angehakt (bei neuen Installationen ab Werk), Präfix ecowittweiche lassen, speichern. Das MQTT-Gateway steht auf Autostart. Nach spätestens einer Minute nennt die Kopfzeile „Minutentakt (MQTT) – letzter Lauf …“."
S1_3 = "MQTT-Gateway nach Schritt 2 oben: unter Fassung 1 trägt das Plugin sein Abo selbst ein; unter Fassung 2 die Datenpunkte der Gruppe ecowittweiche anhaken."
S1_4 = "Die Virtuellen Eingänge {N:status/ok}, {N:quelle}, {N:wechsel} und {N:status/zaehler} anlegen (Peripherie → Virtuelle Eingänge), Namen genau wie in der Namenstabelle oben – Knopf „Kopieren“. Wer die Seite aus dem Musterprojekt kopiert, bekommt sie mit."
S1_5 = "Seite „Ecowitt-Weiche“ anlegen und die vier Eingänge darauf ziehen. Die Zeilen „(entfällt)“ ({B1} bis {B3}, {B7}, {B9}, {B14} bis {B16}) nicht anlegen; die Nummern bleiben, damit die Liste zum Musterprojekt passt."
S1_6 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Wetterstation gestört“, „Wetterstation Ausweichadresse“, „Wetterstation Weiche pendelt“, Texte wie in der Tabelle, auf die Seite ziehen. Jede bekommt genau eine Leitung."
S1_7 = "Übrige Bausteine über die Baustein-Suche (<b>F5</b>) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden. Status „Ecowitt-Weiche“: die Zeilen stehen in der Tabelle und werden von Hand eingetragen, in der angegebenen Reihenfolge, die ohne Bedingung zuletzt. „Impuls um“ bleibt auf 00:00:00."
S1_8 = "Analogwertvalidierung {B28}: Config legt den Eingang En invertiert an – im Eigenschaftsfenster den Haken bei ‚En‘ entfernen, sonst kommt die Konstante 1 als 0 an und die Meldung kommt nie."
S1_9 = "Speichern und übertragen. Probe: der Status zeigt „erste Adresse trägt – heute 0 Wechsel“, und {N:status/zaehler} zählt jede Minute weiter. Wer mag: an der Konsole kurz das WLAN trennen – nach dem nächsten Minutenlauf zeigt der Status „Ausweichadresse trägt“, die Meldung kommt erst nach einer Stunde."
N1_1 = "„Wetterstation gestört“ ({B12}) kommt bei Ausfall beider Adressen, bei eingefrorenen Werten und wenn LoxBerry, MQTT-Gateway oder Plugin sich nicht melden. Sie meldet nur beim Wechsel von Aus auf Ein; die Ausweich- ({B19}) und die Pendelmeldung ({B25}) sind deshalb eigene Meldungen."
N1_2 = "Zu {B17} bis {B19}: Die Weiche prüft die erste Adresse nach 10 Minuten Ausweichbetrieb erneut; die Meldung nach einer Stunde heißt: die erste Adresse bleibt gestört."
N1_3 = "Zu {B20} bis {B25}: {N:wechsel} zählt seit der Installation, „Wechsel heute“ rechnet den Tag heraus. Ein dauerhafter Ausfall ist ein Wechsel, ein wackliger Empfang viele. Nach einem Neustart des Miniservers steht „Wechsel heute“ bis Mitternacht auf 0."
N1_4 = "Über MQTT gibt es kein Alter: eingefrorene Werte meldet {N:status/ok} mit 0 (nur, wenn die Station einen eigenen Zeitstempel liefert). Zustandsbehälter und ALTER gehören zum Weg über HTTP (unten, „Bestehende Anlagen“)."
N1_5 = "Mit MQTT fragt das Plugin die Station jede Minute, zusätzlich zu jedem HTTP-Abruf eines alten Behälters. Wer ganz auf MQTT umgestellt hat, löscht den alten Behälter in Loxone."
S2_1 = "In der Ecowitt-App (WS View Plus) die Einheiten der Konsole auf °C, km/h, mm und hPa stellen – ein Virtueller Eingang rechnet nicht um."
S2_2 = "Die Virtuellen Eingänge {W1} bis {W21} und {W40} bis {W44} anlegen, Namen genau wie in der Tabelle (Namenstabelle oben, Knopf „Kopieren“), Einheit, Min und Max wie dort. {W40} bis {W44} bekommen nur einen Wert, wenn Ihre Station das Feld liefert – welche, nennt der Reiter Test und Protokoll."
S2_3 = "Neue Seite „Ecowitt-Weiche Wetterwerte“ anlegen und die Eingänge darauf ziehen ({W1} wer die Fensterbilanz nutzt ein weiteres Mal auf „Fensterbilanz Messwerte“). Bei Außentemperatur, Außenfeuchte, Windböe, Solarstrahlung, Regen heute und Luftdruck relativ im Eigenschaftsfenster „Statistik“ einschalten."
S2_4 = "Zwei Benachrichtigungen anlegen: „Wetterstation Sturm“ und „Wetterstation Frost“, Texte wie in der Tabelle."
S2_5 = "Übrige Bausteine über <b>F5</b> setzen, Parameter wie in der Tabelle; die Zeilen der Status werden von Hand eingetragen, die ohne Bedingung zuletzt. Fehlen an einem Status Eingänge (V5, V6), so oft „+“ klicken, bis sie da sind."
S2_6 = "Speichern und übertragen. Probe: die Werte in der App mit der Ecowitt-App vergleichen. Zeigt Loxone beim Wind etwa ein Drittel, liefert die Konsole m/s: Schritt 1 wiederholen."
N2_1 = "Fehlwerte: -1 heißt „kein Wert“ (Sensor fehlt oder die Station liefert Striche), bei Temperaturen -999, weil -1 °C ein echter Wert ist. Die Status, der Frost ({W38}, {W39}) und der Nebel ({W34}) fangen beides ab; eigene Logik sollte das auch tun."
N2_2 = "Sturm 60/45 km/h und Frost 1/3 °C sind Beispielschwellen; nach eigenem Bedarf ändern."
N2_3 = "Platzhalter anderer Seiten: Wer eine Ecowitt hat, kann auf „Robonect Steuerung“ statt „Regensensor (eigene Quelle)“ die Regenrate {N:regenrate} über einen Schwellwertschalter (Ein 0,5 / Aus 0,2 mm/h) und auf „Fensterbilanz Messwerte“ statt „Globalstrahlung (eigene Quelle)“ die Solarstrahlung {N:solar} anschließen. Den Platzhalter dann löschen – nicht beides."
N2_4 = "Ein Eingang, für den die Station nichts liefert (etwa {W40} bis {W44} ohne den Sensor), bekommt nie einen Wert und steht auf 0. Welche Zusatzfelder Ihre Station liefert, zeigt der Reiter Test und Protokoll."
S3_1 = "Die Virtuellen Eingänge {BAT1} bis {BAT7} anlegen, Namen genau wie in der Tabelle (Namenstabelle oben, Knopf „Kopieren“). Nur für die Sensoren, die Sie haben – ohne Sensor kommt nie ein Wert."
S3_2 = "Neue Seite „Ecowitt-Weiche Batterien“ anlegen, die Eingänge darauf ziehen, den Status {BAT8} über <b>F5</b> setzen („+“ klicken, bis V7 da ist) und die Zeilen von Hand eintragen."
S3_3 = "Speichern und übertragen. Probe: der Status zeigt die Stufen der Sensoren; welche Batteriefelder Ihre Station liefert, nennt im Plugin der Reiter Test und Protokoll."
N3_1 = "Nur zur Anzeige: die Seite wertet die Batterien nicht aus und meldet nichts. Eine Warnschwelle (etwa Stufe 1 oder darunter) folgt, wenn eine leere Batterie einmal gemessen ist."
N3_2 = "Stufe 0 bis 5 ist eine Stufe, keine Spannung (5 = voll). Ein Eingang, für den kein Sensor angemeldet ist, steht auf 0 – das sieht aus wie „leer“; der Status sagt es deshalb dazu."
N3_3 = "Bodensensoren (EC, Kanal 1 und 2) stehen nicht auf der Seite: {N:batterie_ec1}, {N:spannung_ec1}, {N:batterie_ec2} und {N:spannung_ec2} bei Bedarf nach der Namenstabelle oben selbst anlegen."
