KOPIEREN = "Copy"
S4 = "Step 4: failure detection"
S4_TEXT = "A virtual input <b>keeps its last value</b> when nothing arrives any more – in the app everything looks normal then. That is why the plugin sends the sign of life %s every minute (counts 0 to 999 and wraps). Connect this input to an analog value validation: Tmc 600 s, Min 0, Max 999, constant 1 at En, and remove the tick at ‘En’ in the properties. If the LoxBerry, the minute run or the MQTT gateway stands still, its output E reports. %s = 0 means: both addresses of the station failed or its values froze; %s above 0 tells “frozen” from “both dead”. An age computed from a time stamp is not needed."
S6 = "Step 6: check"
S6_TEXT = "Look at %s in Loxone Config – it counts on every minute. If it stands still: tab MQTT (tick, autostart of the gateway), then step 2."
HTTP_TITEL = "Existing installations: path via HTTP (virtual HTTP input, live.php)"
HTTP_TEXT = "Up to 0.9.24 this was the only path. It stays unchanged for existing installations: live.php passes the JSON of the station on literally, all search texts stay valid. New installations use MQTT (above)."
