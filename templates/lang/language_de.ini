[EINBINDUNG]

S1 = "Schritt 1: MQTT einschalten"
S1_TEXT = "Das LoxBerry-Plugins Musterprojekt holt die Werte der Station über MQTT: jede Minute fragt das Plugin die Station über die Weiche und sendet die Zahlen an das MQTT-Gateway des LoxBerry, das Gateway gibt sie an den Miniserver weiter. Der Haken steht im Reiter „MQTT“ (bei neuen Installationen ab Werk an, bei bestehenden aus)."
S1_EIN = "MQTT ist eingeschaltet – die Werte gehen unter dem Präfix %s hinaus."
S1_AUS = "<b>MQTT ist aus</b> – über MQTT kommt am Miniserver nichts an. Im Reiter „MQTT“ den Haken setzen. Bestehende Anlagen können beim Weg über HTTP bleiben (ganz unten)."
S2 = "Schritt 2: Das MQTT-Gateway"
S2_V1 = "<b>Gateway V1:</b> Das Plugin bringt sein Abo %s mit (Datei mqtt_subscriptions.cfg); einzutragen ist nichts."
S2_UNBEKANNT = "Welche Fassung Ihr MQTT-Gateway hat, ließ sich nicht feststellen. <b>Fassung 1:</b> Das Plugin bringt sein Abo %s mit, einzutragen ist nichts. <b>Fassung 2:</b> die Liste unten."
S2_V2 = "<b>Gateway V2:</b> Unter System → MQTT Gateway → Subscriptions erscheint die Gruppe %s, sobald der Minutentakt einmal gesendet hat. Diese Datenpunkte anhaken:"
