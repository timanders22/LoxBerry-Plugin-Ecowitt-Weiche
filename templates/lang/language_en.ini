ERLAEUTERUNG = "<b>On {B1}:</b> Only the address changes. Set the timeout to at least the stated value – below it Loxone gives up before the fallback address could answer (see <i>When both addresses fail</i>). The same value applies to {B3}.<br><b>On {B8} and {B9}:</b> If both addresses fail, {B3} answers with <span class='sm-mono'>OK=0</span> and ALTER keeps counting. If the station freezes, OK stays 1, but ALTER still grows as soon as the station delivers its own time stamp – hence both paths. ALTER = -1 means “never any data” and lies below the off threshold; {B8} catches that case. Keep MinVal of {B7} at -1, otherwise Loxone turns -1 into 0.<br><b>On {B11}:</b> A short switch to the fallback address is no failure; the delay keeps messages away during switching.<br><b>On {B12}:</b> The notification block only sends on a change from off to on. Never connect several sources directly to its input – combine them with OR first.<br><b>If the LoxBerry itself is gone</b>, {B3} does not answer either: Loxone keeps the last values (OK stays 1, ALTER stands still). Only the online status of the containers shows that."
