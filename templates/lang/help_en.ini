; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is in double quotes and contains none itself; markup stays
; raw, the help is not escaped on output.

[HILFE]
K01 = "Ecowitt Failover"
K02 = "On 23 August 2026 the weather station of this house reported <span class='sm-mono'>---.-</span> for temperature, humidity, solar radiation and UV over its LAN interface 192.168.178.20. Loxone turned that into 0. At the very same moment the same station delivered 23.4 degrees and 673.64 W/m² over WiFi. The shading of the house spent hours calculating with zero sun."
K03 = "An Ecowitt console has two network interfaces on two addresses. A virtual HTTP input in Loxone can only carry one of them. If it fails, every value behind it reads 0 - and in Loxone logic 0 is a valid measurement, not an error."
K04 = "The decisive point"
K05 = "<b>The broken side was reachable.</b> It answered with HTTP 200 and valid JSON, only without numbers in it. A failover that merely watches for connection errors would have stayed on the broken interface that day and changed nothing at all."
K06 = "This is why the plugin checks the <b>content</b>: an answer only counts as usable when the outdoor humidity (id <span class='sm-mono'>0x07</span>) is a number greater than zero. Real outdoor air is never at 0 percent, so the placeholders <span class='sm-mono'>--</span> and <span class='sm-mono'>---.-</span> fail the test. The check can be switched off - for a station that has no field 0x07; then only the fact that something answered counts again."
K07 = "What the plugin does - and what it does not"
K08 = "<b>It asks and passes through.</b> First the primary address, and on an unusable answer the fallback address. Whatever the carrying interface delivered goes out <b>verbatim</b>; only two own fields are prepended, <span class='sm-mono'>ew_quelle</span> and <span class='sm-mono'>ew_ok</span>. Every search pattern in Loxone therefore stays valid - exactly one place changes in the project file, the address of the container."
K09 = "<b>It measures nothing itself</b> and converts nothing. It only decides which of the two interfaces is currently carrying."
K10 = "<b>It caches no measurements.</b> If both sides fail, HTTP 503 comes back <b>without data</b>. That is deliberate: Loxone then keeps its last values and drops the online status of the container - so the failure is visible. Delivering a cached state here would let the house calculate with stale numbers for hours without anyone noticing. That silent kind of fault is exactly what this plugin is meant to end."
K11 = "Setting it up"
K12 = "Enter both addresses on the Settings tab, without <span class='sm-mono'>http://</span> and without a path - here 192.168.178.20 and 192.168.178.21. Which one comes first is a matter of taste: LAN is normally the more stable one, WiFi depends on radio. Leaving one of them empty disables that side."
K13 = "Then press the button on the Test tab. It queries <b>both</b> addresses and puts temperature, humidity, solar radiation and UV side by side. Dashes instead of numbers on one side mean the station answers there but has lost the radio link to the outdoor sensor - and that is precisely the side that would have kept carrying without the content check."
K14 = "Loxone integration"
K15 = "In the container of the virtual HTTP input, replace the address with the one shown on the integration tab - the container, not the individual commands. The polling time stays as it was. All search patterns stay unchanged, because the JSON is the same."
K16 = "In addition <span class='sm-mono'>live.php?status=1</span> answers with one line of text describing the state of the switch itself: whether any data arrives at all, which side is carrying, how often it has changed since start, and how old the last usable data is. This belongs in the house as its own virtual input - otherwise the switch works unnoticed, and an interface that has been dead for weeks only shows up when the second one fails too."
K17 = "<b>Mind MinVal when creating these inputs.</b> <span class='sm-mono'>ALTER</span> is -1 as long as no usable data has ever arrived. With MinVal at 0 Loxone turns that into a 0 - and 0 would then wrongly mean brand new."
K18 = "The log"
K19 = "Only a <b>change</b> from one interface to the other is recorded, together with the reason the abandoned side was rejected. Not every request: a one-minute poll would otherwise produce 1440 lines a day, burying the one that matters. An empty log means no change has happened yet."
K20 = "What the plugin does not cure"
K21 = "It keeps operation running, it repairs nothing. If the switch stays on the fallback address, the first interface is broken - cable, switch or station - and that needs looking at. This is what the change counter in the interface and in the status query is for."
