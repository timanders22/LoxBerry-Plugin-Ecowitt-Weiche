; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der Hilfe.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst
; keine; Auszeichnung bleibt roh, die Hilfe wird nicht maskiert ausgegeben.

[HILFE]
K01 = "Ecowitt-Weiche"
K02 = "Am 23.08.2026 meldete die Wetterstation dieses Hauses über die LAN-Schnittstelle 192.168.178.20 für Temperatur, Feuchte, Solarstrahlung und UV die Zeichenfolge <span class='sm-mono'>---.-</span>. Loxone machte daraus 0. Im selben Augenblick lieferte dieselbe Station über WLAN 23,4 Grad und 673,64 W/m². Die Beschattung des Hauses rechnete stundenlang mit null Sonne."
K03 = "Eine Ecowitt-Konsole hat zwei Netzwerkschnittstellen unter zwei Adressen. Ein virtueller HTTP-Eingang in Loxone kann aber nur eine davon tragen. Fällt sie aus, stehen alle daran hängenden Werte auf 0 — und 0 ist in einer Loxone-Logik ein gültiger Messwert, kein Fehler."
K04 = "Der entscheidende Punkt"
K05 = "<b>Die kaputte Seite war erreichbar.</b> Sie antwortete mit HTTP 200 und gültigem JSON, nur ohne Zahlen darin. Ein Ausweichen, das bloß auf Verbindungsfehler achtet, wäre an diesem Tag auf der kaputten Schnittstelle geblieben und hätte gar nichts geändert."
K06 = "Deshalb prüft dieses Plugin den <b>Inhalt</b>: eine Antwort gilt erst dann als brauchbar, wenn die Außenfeuchte (Kennung <span class='sm-mono'>0x07</span>) eine Zahl größer null ist. Reale Außenluft hat nie 0 Prozent, und die Platzhalter <span class='sm-mono'>--</span> und <span class='sm-mono'>---.-</span> fallen damit durch. Die Prüfung lässt sich abschalten — für eine Station, die kein Feld 0x07 kennt; dann zählt wieder nur, dass überhaupt geantwortet wurde."
K07 = "Was das Plugin tut — und was nicht"
K08 = "<b>Es fragt und reicht durch.</b> Zuerst die erste Adresse, bei unbrauchbarer Antwort die Ausweichadresse. Was die tragende Schnittstelle geliefert hat, geht <b>wortgetreu</b> hinaus; vorangestellt werden nur zwei eigene Felder, <span class='sm-mono'>ew_quelle</span> und <span class='sm-mono'>ew_ok</span>. Damit bleibt in Loxone jeder Suchtext gültig — in der Projektdatei ändert sich eine einzige Stelle, die Adresse des Behälters."
K09 = "<b>Es misst nichts selbst</b> und rechnet nichts um. Es entscheidet nur, welche der beiden Schnittstellen gerade trägt."
K10 = "<b>Es speichert keine Messwerte zwischen.</b> Fallen beide Seiten aus, kommt HTTP 503 <b>ohne Daten</b>. Das ist Absicht: Loxone behält dann seine letzten Werte und schaltet den Onlinestatus des Behälters ab — der Ausfall ist also sichtbar. Würde hier ein zwischengespeicherter Stand geliefert, rechnete das Haus stundenlang mit alten Zahlen weiter, ohne dass es jemand merkt. Genau diese stille Sorte Fehler soll das Plugin beenden."
K11 = "Einrichten"
K12 = "Im Reiter Einstellungen beide Adressen eintragen, ohne <span class='sm-mono'>http://</span> und ohne Pfad — hier also 192.168.178.20 und 192.168.178.21. Welche der beiden vorn steht, ist eine Frage des Geschmacks: LAN ist im Normalfall die stabilere, WLAN hängt am Funk. Wer eine der beiden leer lässt, schaltet diese Seite ab."
K13 = "Danach im Reiter Test den Knopf drücken. Er fragt <b>beide</b> Adressen an und stellt Temperatur, Feuchte, Solarstrahlung und UV nebeneinander. Stehen auf einer Seite Striche statt Zahlen, antwortet die Station dort zwar, hat aber den Funk zum Außensensor verloren — und genau diese Seite hätte ohne Inhaltsprüfung weiter getragen."
K14 = "Einbindung in Loxone"
K15 = "Im Behälter des virtuellen HTTP-Eingangs die Adresse durch die im Reiter Einbindung angezeigte ersetzen — den Behälter, nicht die einzelnen Befehle. Die Abfragezeit bleibt, wie sie war. Alle Suchtexte bleiben unverändert, weil das JSON dasselbe ist."
K16 = "Zusätzlich beantwortet <span class='sm-mono'>live.php?status=1</span> in einer Textzeile den Zustand der Weiche selbst: ob überhaupt Daten kommen, welche Seite trägt, wie oft seit dem Start umgeschaltet wurde und wie alt die letzten brauchbaren Daten sind. Das gehört als eigener virtueller Eingang ins Haus — sonst arbeitet die Weiche unbemerkt, und dass eine Schnittstelle seit Wochen tot ist, fällt erst auf, wenn auch die zweite ausfällt."
K17 = "<b>Beim Anlegen dieser Eingänge auf MinVal achten.</b> <span class='sm-mono'>ALTER</span> ist −1, solange noch nie brauchbare Daten kamen. Steht MinVal auf 0, macht Loxone daraus eine 0 — und 0 hieße dann fälschlich taufrisch."
K18 = "Das Protokoll"
K19 = "Aufgeschrieben wird nur der <b>Wechsel</b> von einer Schnittstelle zur anderen, mitsamt dem Grund, aus dem die verlassene Seite verworfen wurde. Nicht jeder Abruf: eine Minutenabfrage erzeugte sonst 1440 Zeilen am Tag, in denen die eine wichtige untergeht. Ist das Protokoll leer, hat es noch keinen Wechsel gegeben."
K20 = "Was das Plugin nicht heilt"
K21 = "Es hält den Betrieb aufrecht, es repariert nichts. Springt die Weiche dauerhaft auf die Ausweichadresse, ist die erste Schnittstelle defekt — Kabel, Verteiler oder Station — und das gehört angesehen. Dafür steht der Zähler der Wechsel in der Oberfläche und im Statusabruf."
