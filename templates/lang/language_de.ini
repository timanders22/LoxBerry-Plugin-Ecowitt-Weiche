B13_PARAM = "Zeilen: V5 = 1 „LoxBerry oder Plugin antwortet nicht – alle Wetterwerte sind eingefroren; LoxBerry und Plugin Ecowitt-Weiche prüfen“; V2 = 0 „keine brauchbaren Daten – beide Adressen der Station ausgefallen (seit &lt;v3&gt; s); im Plugin Reiter Test und Protokoll ‚Beide Adressen jetzt prüfen‘“; V3 &gt;= 900 „Daten &lt;v3&gt; s alt – die Station sendet keine neuen Werte, Station neu starten“; V1 = 2 „Ausweichadresse trägt – die erste Adresse ist gestört; heute &lt;v4&gt; Wechsel“; V1 = 1 „erste Adresse trägt – heute &lt;v4&gt; Wechsel“; ohne Bedingung „keine brauchbaren Daten“"
