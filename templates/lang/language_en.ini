SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_1 = "In the plugin tab <b>Settings</b> enter the first address (e.g. Wi-Fi of the console) and the fallback address (e.g. LAN) without http://, keep the timeout of 3 s, keep “Check the content” on, save. Tab <b>Test and log</b> → “Check both addresses now”: both lines “usable”."
S1_2 = "Read the two addresses at the top of this tab (they already carry your token) and note the stated timeout (7000 ms by default)."
S1_3 = "In Loxone Config open the existing container of your station (Periphery → Virtual Inputs) and change <b>only</b> the address to the switch, timeout 7000 ms. All commands stay. If you have no container yet: the button “Download weather station template” above (page “Ecowitt-Weiche Wetterwerte”, step 1)."
S1_4 = "Create the status container: the button “Download status template” above. In Loxone Config select <b>Virtual Inputs</b> in the tree on the left, then in the ribbon <b>Predefined HTTP devices → Import template…</b> → “Ecowitt-Weiche Zustand”, import it only <b>once</b>. The template already carries address and token; enter the timeout 7000 ms in the container."
S1_5 = "Create the page “Ecowitt-Weiche”. Drag OK, Quelle, Wechsel and Alter from “Ecowitt-Weiche Zustand” and the outdoor temperature (Außentemperatur) from your station container. For Außentemperatur switch on <b>“Show error output”</b> (German Config: „Fehlerausgang anzeigen“) in the properties window – a red output appears on the right."
S1_6 = "Create three notifications (Periphery → Messages → Notification): „Wetterstation gestört“, „Wetterstation Ausweichadresse“, „Wetterstation Weiche pendelt“, texts as in the table, drag them onto the page. Each gets exactly one connection."
S1_7 = "Place the remaining blocks via the block search (<b>F5</b>), parameters as in the table, connect from top to bottom; an OR has two inputs. Status „Ecowitt-Weiche“: click “+” once first (V5 only appears then); the lines are in the table and are entered by hand, in the given order, the one without condition last. “Pulse at” stays at 00:00:00. Lines {B14} and {B15} are dropped."
S1_8 = "<b>Connect by hand:</b> the red error output of the outdoor temperature ({B2}) to I2 of the OR {B16} and to V5 of the status {B13}."
S1_9 = "Save and transfer. Check: the status shows “first address carries – today 0 changes”, in the plugin tab <b>Test and log</b> the same side carries. If you like: briefly disconnect the Wi-Fi at the console – after the next poll the status shows “fallback address carries”, the message only comes after one hour."
N1_1 = "„Wetterstation gestört“ ({B12}) comes when both addresses fail, when the values freeze and when LoxBerry or plugin do not answer. It only reports on a change from off to on; the fallback message ({B19}) and the toggling message ({B25}) are therefore separate messages."
N1_2 = "On {B14} and {B15}: both lines are dropped – Loxone Config 17 does not show the online status of the container in the tree. The error output of {B2} takes their place; the numbers stay so that the list matches the sample project."
N1_3 = "On {B17} to {B19}: the switch re-checks the first address after 10 minutes of fallback operation; the message after one hour means: the first address stays faulty."
N1_4 = "On {B20} to {B25}: WECHSEL counts since the installation, „Wechsel heute“ takes out the day. A permanent failure is one change, an unstable reception many. After a restart of the Miniserver „Wechsel heute“ stays at 0 until midnight."
N1_5 = "After “Generate a new token” in the plugin enter both addresses again in Loxone, otherwise the switch answers with 403 – a template downloaded before then also carries the old token."
S2_1 = "Container for the station: if you already have one (page “Ecowitt-Weiche”, step 3), add the missing commands in it by hand (right-click on the container → Virtual HTTP input command; title, search text, min/max and unit as in the table under <i>Templates for Loxone Config</i>). If you have none: button “Download weather station template”, in Loxone Config select <b>Virtual Inputs</b> in the tree on the left, then in the ribbon <b>Predefined HTTP devices → Import template…</b> → “Wetterstation Ecowitt”, enter the timeout 7000 ms in the container. <b>Never both</b> – otherwise two containers for one station."
S2_2 = "In the Ecowitt app (WS View Plus) set the units of the console to °C, km/h, mm and hPa."
S2_3 = "Create a new page “Ecowitt-Weiche Wetterwerte”. Drag the 21 commands (“Außentemperatur” once more). For Außentemperatur, Außenfeuchte, Windböe, Solarstrahlung, Regen heute and Luftdruck relativ switch on “Statistics” in the properties window."
S2_4 = "Create two notifications: „Wetterstation Sturm“ and „Wetterstation Frost“, texts as in the table."
S2_5 = "Place the remaining blocks via <b>F5</b>, parameters as in the table; the lines of the status blocks are entered by hand. Status „Wetter außen“ “+” once (V5), „Regen“ and „Innen, Luftdruck und Blitz“ twice each (V5, V6)."
S2_6 = "Save and transfer. Check: compare the values in the app with the Ecowitt app. If Loxone shows about a third for the wind, the console delivers m/s: set the scaling 1 → 3.6 in the command (or repeat step 2)."
N2_1 = "The commands read the JSON of the station; which values arrive depends on the station and its sensors: without a lightning sensor the lightning values stay 0, without a rain gauge the rain values. If a value stays at 0 although the Ecowitt app shows it: look at the answer of the station in the browser (<span class='sm-mono'>http://&lt;console&gt;/get_livedata_info</span>) and compare the search text."
N2_2 = "Storm 60/45 km/h and frost 1/3 °C are example thresholds; change them as you need."
N2_3 = "Placeholders of other pages: with an Ecowitt you can connect the rain rate ({W10}) via a threshold switch (on 0.5 / off 0.2 mm/h) on „Robonect Steuerung“ instead of „Regensensor (eigene Quelle)“, and the solar radiation ({W8}) on „Fensterbilanz Messwerte“ instead of „Globalstrahlung (eigene Quelle)“. Then delete the placeholder – not both."

[VORLAGE]

H = "Templates for Loxone Config"
TEXT = "Two templates to import, address and token already filled in: <b>Ecowitt-Weiche Zustand</b> (four commands OK, Quelle, Wechsel, Alter) and <b>Wetterstation Ecowitt</b> (21 readings of the station). The station template is an example for Ecowitt consoles GW1000/GW2000/GW3000; fields without a sensor stay 0. If your station is already in Loxone, do <b>not</b> import it, but add missing commands by hand following the table below – otherwise there are two containers for one station."
K_ZUSTAND = "Download status template"
K_WETTER = "Download weather station template"
HINWEIS = "A template carries no timeout: after the import enter <b>%d ms</b> in the container. Import each template only once (tree on the left <b>Virtual Inputs</b> → ribbon <b>Predefined HTTP devices → Import template…</b>). Titles and commands stay German, the comments follow the language of the LoxBerry. After “Generate a new token” download the templates again or change the addresses by hand."
