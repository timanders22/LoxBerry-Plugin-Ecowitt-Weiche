<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Scheibe und Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)">
    <!-- Hauptgrafik nach oben verschoben (Y = -35px) -->
    <g transform="translate(0, -35)">
      <!-- Der wartende Zweig: gestrichelt, weil er gerade nicht traegt -->
      <line x1="150.0" y1="312.0" x2="168.0" y2="303.3" stroke="#ffffff" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round" />
      <line x1="182.5" y1="296.4" x2="200.5" y2="287.8" stroke="#ffffff" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round" />
      <line x1="214.9" y1="280.8" x2="232.9" y2="272.2" stroke="#ffffff" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round" />
      <line x1="247.4" y1="265.3" x2="265.4" y2="256.6" stroke="#ffffff" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round" />
      <line x1="279.8" y1="249.7" x2="297.8" y2="241.0" stroke="#ffffff" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round" />
      <!-- Der tragende Zweig: durchgezogen, von der Schnittstelle ueber die Weiche zum Miniserver -->
      <polyline points="150,160 300,240 398,240" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      <polygon points="390,206 452,240 390,274" fill="#ffffff" />
      <!-- Die Weiche selbst -->
      <circle cx="300" cy="240" r="16" fill="#ffffff" />
      <!-- Oben: die Schnittstelle, die traegt - gefuellt -->
      <circle cx="150" cy="160" r="30" fill="#ffffff" />
      <circle cx="150" cy="160" r="13" fill="#6dac20" />
      <!-- Unten: die Schnittstelle, die bereitsteht - nur umrandet -->
      <circle cx="150" cy="312" r="26" fill="#6dac20" stroke="#ffffff" stroke-opacity="0.55" stroke-width="9" />
    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Ecowitt</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
