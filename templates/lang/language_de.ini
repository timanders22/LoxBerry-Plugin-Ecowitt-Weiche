RECONNECT = "Nach einem Neustart des Miniservers kommt das Lebenszeichen spätestens nach einer Minute, alle übrigen Werte spätestens nach fünf Minuten (voller Satz); der Startimpuls der Musterseite „LoxBerry MQTT-Gateway“ (reconnect) beschleunigt das."
KEINE_BEFEHLE = "Die Weiche hat keine Befehle; für Befehle ist nichts einzutragen."
S3 = "Schritt 3: Virtuelle Eingänge anlegen"
S3_TEXT = "Je Wert in Loxone Config einen <b>Virtuellen Eingang</b> anlegen (Peripherie → Virtuelle Eingänge). Der Name muss genau so heißen, wie das MQTT-Gateway ihn vergibt – den Knopf „Kopieren“ benutzen. Für die Werte gibt es keine Importvorlage; alle Werte sind Zahlen."
S3_DIGITAL = "„Als Digitaleingang verwenden“ nicht aktivieren – -1 heißt „kein Wert“ und würde sonst zu EIN."
S3_RECHTE = "Der LoxBerry-Benutzer am Miniserver braucht Rechte auf diese Eingänge, sonst schreibt das MQTT-Gateway nichts hinein."
S3_MUSTER = "Wer die Seiten „Ecowitt-Weiche“, „Ecowitt-Weiche Wetterwerte“ und „Ecowitt-Weiche Batterien“ aus dem Musterprojekt kopiert, bekommt die Eingänge mit."
S3_PRAEFIX = "Ein geändertes Präfix (Reiter MQTT) ändert alle Namen – die Eingänge in Loxone dann umbenennen."
S3_EINHEITEN = "Einheiten an der Konsole auf °C, km/h, mm und hPa stellen: ein Virtueller Eingang kann nicht umrechnen."
S3_WAHL = "Einträge mit einem Zusatz in Klammern kommen nur, wenn die Station das Feld liefert; ohne den Sensor bleibt der Eingang ohne Wert."
