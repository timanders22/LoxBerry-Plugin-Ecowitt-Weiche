ERLAEUTERUNG = "<b>Zu {B1} und {B3}:</b> Den Timeout beider Behälter mindestens auf den genannten Wert setzen – darunter gibt Loxone auf, bevor die Ausweichadresse antworten konnte (siehe <i>Wenn beide Adressen ausfallen</i>).<br><b>Zu {B8} und {B9}:</b> Fallen beide Adressen aus, antwortet {B3} mit <span class='sm-mono'>OK=0</span>, und ALTER zählt weiter. Friert die Station ein, bleibt OK auf 1, ALTER wächst trotzdem, sobald die Station einen eigenen Zeitstempel liefert – deshalb beide Wege. ALTER = -1 heißt „noch nie Daten“ und liegt unter der Ausschaltschwelle; diesen Fall fängt {B8}. MinVal von {B7} auf -1 lassen, sonst macht Loxone aus -1 eine 0.<br><b>Zu {B11}:</b> Ein kurzer Wechsel auf die Ausweichadresse ist kein Ausfall; die Verzögerung hält Meldungen beim Umschalten fern.<br><b>Zu {B12}:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Niemals mehrere Quellen direkt an seinen Eingang – erst über ODER zusammenführen.<br><b>Ist der LoxBerry selbst weg</b>, antwortet auch {B3} nicht: Loxone behält die letzten Werte (OK bleibt 1, ALTER steht). Das zeigt der Fehlerausgang der Außentemperatur ({B2}): er wird 1, wenn der Behälter keinen gültigen Wert bekommt. Deshalb hängt er über das ODER {B16} an derselben Meldung und an V5 des Status {B13}."
