HINWEISE_TITEL = "Hinweise"
S1_1 = "Im Plugin Reiter <b>Einstellungen</b> die erste Adresse (z. B. WLAN der Konsole) und die Ausweichadresse (z. B. LAN) ohne http:// eintragen, Wartezeit 3 s lassen, „Den Inhalt prüfen“ an lassen, speichern. Reiter <b>Test und Protokoll</b> → „Beide Adressen jetzt prüfen“: beide Zeilen „brauchbar“."
S1_2 = "In diesem Reiter oben die beiden Adressen ablesen (sie tragen schon Ihr Wortzeichen) und den genannten Timeout merken (ab Werk 7000 ms)."
S1_3 = "In Loxone Config den vorhandenen Behälter Ihrer Station öffnen (Peripherie → Virtuelle Eingänge) und <b>nur</b> die Adresse auf die Weiche umstellen, Timeout 7000 ms. Alle Befehle bleiben. Wer noch keinen Behälter hat: oben den Knopf „Vorlage Wetterstation herunterladen“ (Seite „Ecowitt-Weiche Wetterwerte“, Schritt 1)."
S1_4 = "Zustandsbehälter anlegen: oben den Knopf „Vorlage Zustand herunterladen“. In Loxone Config im Baum links <b>Virtuelle Eingänge</b> wählen, dann im Menüband <b>Vordefinierte HTTP-Geräte → Vorlage Importieren…</b> → „Ecowitt-Weiche Zustand“, nur <b>einmal</b> einlesen. Adresse und Wortzeichen trägt die Vorlage schon; im Behälter Timeout 7000 ms eintragen."
S1_5 = "Seite „Ecowitt-Weiche“ anlegen. Aus „Ecowitt-Weiche Zustand“ OK, Quelle, Wechsel und Alter ziehen, aus Ihrem Stationsbehälter die Außentemperatur. Bei der Außentemperatur im Eigenschaftsfenster <b>„Fehlerausgang anzeigen“</b> einschalten – rechts erscheint ein roter Ausgang."
S1_6 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Wetterstation gestört“, „Wetterstation Ausweichadresse“, „Wetterstation Weiche pendelt“, Texte wie in der Tabelle, auf die Seite ziehen. Jede bekommt genau eine Leitung."
S1_7 = "Übrige Bausteine über die Baustein-Suche (<b>F5</b>) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden; ein ODER hat zwei Eingänge. Status „Ecowitt-Weiche“: vorher einmal „+“ klicken (V5 erscheint erst danach); die Zeilen stehen in der Tabelle und werden von Hand eingetragen, in der angegebenen Reihenfolge, die ohne Bedingung zuletzt. „Impuls um“ bleibt auf 00:00:00. Die Zeilen {B14} und {B15} entfallen."
S1_8 = "<b>Von Hand verbinden:</b> den roten Fehlerausgang der Außentemperatur ({B2}) an I2 des ODER {B16} und an V5 des Status {B13}."
S1_9 = "Speichern und übertragen. Probe: der Status zeigt „erste Adresse trägt – heute 0 Wechsel“, im Plugin Reiter <b>Test und Protokoll</b> trägt dieselbe Seite. Wer mag: an der Konsole kurz das WLAN trennen – nach dem nächsten Abruf zeigt der Status „Ausweichadresse trägt“, die Meldung kommt erst nach einer Stunde."
N1_1 = "„Wetterstation gestört“ ({B12}) kommt bei Ausfall beider Adressen, bei eingefrorenen Werten und wenn LoxBerry oder Plugin nicht antworten. Sie meldet nur beim Wechsel von Aus auf Ein; die Ausweich- ({B19}) und die Pendelmeldung ({B25}) sind deshalb eigene Meldungen."
N1_2 = "Zu {B14} und {B15}: Beide Zeilen entfallen – Loxone Config 17 zeigt den Onlinestatus des Behälters nicht im Baum. An ihre Stelle tritt der Fehlerausgang von {B2}; die Nummern bleiben, damit die Liste zum Musterprojekt passt."
N1_3 = "Zu {B17} bis {B19}: Die Weiche prüft die erste Adresse nach 10 Minuten Ausweichbetrieb erneut; die Meldung nach einer Stunde heißt: die erste Adresse bleibt gestört."
N1_4 = "Zu {B20} bis {B25}: WECHSEL zählt seit der Installation, „Wechsel heute“ rechnet den Tag heraus. Ein dauerhafter Ausfall ist ein Wechsel, ein wackliger Empfang viele. Nach einem Neustart des Miniservers steht „Wechsel heute“ bis Mitternacht auf 0."
N1_5 = "Nach „Wortzeichen neu erzeugen“ im Plugin beide Adressen in Loxone neu eintragen, sonst antwortet die Weiche mit 403 – auch eine vorher heruntergeladene Vorlage trägt dann das alte Wortzeichen."
S2_1 = "Behälter für die Station: wer schon einen hat (Seite „Ecowitt-Weiche“, Schritt 3), legt die fehlenden Befehle darin von Hand an (Rechtsklick auf den Behälter → Virtueller HTTP-Eingang-Befehl; Titel, Suchtext, Min/Max und Einheit wie in der Tabelle unter <i>Vorlagen für Loxone Config</i>). Wer keinen hat: Knopf „Vorlage Wetterstation herunterladen“, in Loxone Config im Baum links <b>Virtuelle Eingänge</b> wählen, dann im Menüband <b>Vordefinierte HTTP-Geräte → Vorlage Importieren…</b> → „Wetterstation Ecowitt“, im Behälter Timeout 7000 ms eintragen. <b>Nie beides</b> – sonst zwei Behälter für eine Station."
S2_2 = "In der Ecowitt-App (WS View Plus) die Einheiten der Konsole auf °C, km/h, mm und hPa stellen."
S2_3 = "Neue Seite „Ecowitt-Weiche Wetterwerte“ anlegen. Die 21 Befehle ziehen („Außentemperatur“ ein weiteres Mal). Bei Außentemperatur, Außenfeuchte, Windböe, Solarstrahlung, Regen heute und Luftdruck relativ im Eigenschaftsfenster „Statistik“ einschalten."
S2_4 = "Zwei Benachrichtigungen anlegen: „Wetterstation Sturm“ und „Wetterstation Frost“, Texte wie in der Tabelle."
S2_5 = "Übrige Bausteine über <b>F5</b> setzen, Parameter wie in der Tabelle; die Zeilen der Status werden von Hand eingetragen. Status „Wetter außen“ einmal „+“ (V5), „Regen“ und „Innen, Luftdruck und Blitz“ je zweimal (V5, V6)."
S2_6 = "Speichern und übertragen. Probe: die Werte in der App mit der Ecowitt-App vergleichen. Zeigt Loxone beim Wind etwa ein Drittel, liefert die Konsole m/s: im Befehl die Skalierung 1 → 3,6 setzen (oder Schritt 2 wiederholen)."
N2_1 = "Die Befehle lesen das JSON der Station; welche Werte ankommen, bestimmen Station und Sensoren: ohne Blitzsensor bleiben die Blitzwerte 0, ohne Regenmesser die Regenwerte. Steht ein Wert dauerhaft auf 0, obwohl die Ecowitt-App ihn zeigt: die Antwort der Station im Browser ansehen (<span class='sm-mono'>http://&lt;Konsole&gt;/get_livedata_info</span>) und den Suchtext vergleichen."
N2_2 = "Sturm 60/45 km/h und Frost 1/3 °C sind Beispielschwellen; nach eigenem Bedarf ändern."
N2_3 = "Platzhalter anderer Seiten: Wer eine Ecowitt hat, kann auf „Robonect Steuerung“ statt „Regensensor (eigene Quelle)“ die Regenrate ({W10}) über einen Schwellwertschalter (Ein 0,5 / Aus 0,2 mm/h) und auf „Fensterbilanz Messwerte“ statt „Globalstrahlung (eigene Quelle)“ die Solarstrahlung ({W8}) anschließen. Den Platzhalter dann löschen – nicht beides."

