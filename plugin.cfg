[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der
# es Installation und Updates fuehrt. Sie duerfen spaeter NIE geaendert
# werden - LoxBerry hielte das Plugin sonst fuer ein anderes, und jedes
# Update schluege fehl. Deshalb steht hier ein Projektname und eine
# noreply-Adresse und keine Person.
NAME=Ecowitt-Weiche Plugin Authors
EMAIL=ecowittweiche@users.noreply.github.com

[PLUGIN]
VERSION=0.9.9
NAME=ecowittweiche
FOLDER=ecowittweiche
TITLE=Ecowitt-Weiche

[AUTOUPDATE]
# Seit 0.9.9 EIN. Bis dahin stand hier bewusst false, solange das
# Repository noch nicht stand: eine Adresse, die ins Leere zeigt, waere
# schlimmer als keine - LoxBerry fragt sie ab und meldet einen Fehler,
# ohne dass irgendetwas kaputt ist.
#
# Die Bedingung ist erfuellt: github.com/timanders22/LoxBerry-Plugin-Ecowitt-Weiche
# gibt es seit dem 23.08.2026, der Zweig master traegt release.cfg und
# prerelease.cfg, und beide Adressen dort zeigen auf einen Tag, den es
# gibt (erstes Release v0.9.3).
#
# Merke: diese Zeile steht IM Plugin. Ein Wechsel von false auf true
# erreicht nur Anlagen, die mindestens einmal von Hand aktualisieren -
# wer nie aktualisiert, bekommt auch die Einstellung nicht, die das
# Aktualisieren einschalten wuerde.
#
# Bei jedem Release: VERSION hier UND in release.cfg erhoehen, beide
# Adressen dort auf den neuen Tag setzen, das Release mit genau diesem
# Tag anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
#
# Beide Adressen zeigen auf den Zweig master des EIGENEN Repositoriums -
# nie auf ein fremdes. LoxBerry vergleicht Fassungen als Zahl, und ein
# fremdes 2021.05.14 waere groesser als 0.9.9; daraus wuerde ein stilles
# Downgrade auf ein voellig anderes Plugin.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Ecowitt-Weiche/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Ecowitt-Weiche/master/prerelease.cfg
[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Wie bei den uebrigen Plugins dieses Hauses. Das Plugin ist reines PHP und
# braucht nichts nachzuinstallieren; die Grenze steht fuer die Umgebung, in
# der es geprueft wurde.
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl ruft bei Ueberschreitung &fail() - die
# Installation wird abgebrochen, nicht nur gewarnt.
LB_MAXIMUM=false
# SYSTEM.ARCHITECTURE wird von plugininstall.pl gelesen und danach nie
# benutzt. Eine Angabe verhindert also nichts, waere aber eine unwahre
# Aussage - das Plugin laeuft ueberall.
ARCHITECTURE=false
