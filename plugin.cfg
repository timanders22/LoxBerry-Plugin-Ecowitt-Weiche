[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der
# es Installation und Updates fuehrt. Sie duerfen spaeter NIE geaendert
# werden - LoxBerry hielte das Plugin sonst fuer ein anderes, und jedes
# Update schluege fehl. Deshalb steht hier ein Projektname und eine
# noreply-Adresse und keine Person.
NAME=Ecowitt-Weiche Plugin Authors
EMAIL=ecowittweiche@users.noreply.github.com

[PLUGIN]
VERSION=0.9.3
NAME=ecowittweiche
FOLDER=ecowittweiche
TITLE=Ecowitt-Weiche

[AUTOUPDATE]
# Bewusst AUS, solange es das Repository noch nicht gibt. Eine Adresse, die
# ins Leere zeigt, waere schlimmer als keine: LoxBerry fragt sie ab und
# meldet einen Fehler, ohne dass irgendetwas kaputt ist.
#
# Beim ersten Release drei Stellen gleichzeitig anfassen:
#   1. hier AUTOMATIC_UPDATES=true und beide Adressen eintragen
#   2. release.cfg und prerelease.cfg -> VERSION und beide Adressen
#   3. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z) anlegen
# und danach nachpruefen, dass der Tag wirklich existiert.
#
# Beide Adressen muessen auf das EIGENE Repositorium zeigen - nie auf ein
# fremdes. LoxBerry vergleicht Fassungen als Zahl, und ein fremdes 2021.05.14
# waere groesser als 0.9.0; daraus wuerde ein stilles Downgrade auf ein
# voellig anderes Plugin.
AUTOMATIC_UPDATES=false
RELEASECFG=
PRERELEASECFG=

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Wie bei den uebrigen Plugins dieses Hauses. Das Plugin ist reines PHP und
# braucht nichts nachzuinstallieren; die Grenze steht fuer die Umgebung, in
# der es geprueft wurde.
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl ruft bei Ueberschreitung &fail() - die
# Installation wird abgebrochen, nicht nur gewarnt.
LB_MAXIMUM=false
# SYSTEM.ARCHITECTURE wird von plugininstall.pl gelesen und danach nie
# benutzt. Eine Angabe verhindert also nichts, waere aber eine unwahre
# Aussage - das Plugin laeuft ueberall.
ARCHITECTURE=false
