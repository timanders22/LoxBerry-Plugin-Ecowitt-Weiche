WARUM = "An Ecowitt console often has two network interfaces, LAN and WiFi, on two addresses. A Loxone virtual HTTP input can only hold one of them. If it fails, every value behind it reads 0 - and in Loxone logic 0 is a valid measurement, not an error. This plugin asks both addresses and passes through the answer of whichever interface is currently working."
