PROJ_HILFE = "Only a project file that has been placed on the LoxBerry is read: the newest <b>*.Loxone</b> file in the folder %s (via the LoxBerry Windows share, WinSCP or scp). There is deliberately no upload on this page: on the LoxBerry PHP accepts at most 2 MB per file, and a project file is usually larger. The plugin reads the file whenever this tab or the Test tab is opened and stores nothing from it; only title and timeout are shown, never the addresses. The file contains the addresses including the tokens of all containers - please remove it after the check. An update clears this folder anyway."
