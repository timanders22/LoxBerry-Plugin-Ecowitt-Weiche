; Ecowitt-Weiche - English
;
; Every key used here must also exist in language_de.ini.
; Put every value in double quotes: with parse_ini_file a semicolon starts a
; comment, and every HTML entity ends with one. No double quote inside a
; value - quote HTML attributes with single quotes: <span class='sm-mono'>.

