LOX_503 = "If both addresses fail, the endpoint answers HTTP 503 without data. Loxone then keeps all values it read last, and the <b>error output</b> of the command Außentemperatur becomes 1 (switch on “Display Error Output” in the properties window of the command). A failure is therefore seen at this error output or in <b>OK=</b> of the state container: live.php?status=1 answers even during a failure, then with OK=0."
LOX_AUSFALL_H = "When both addresses fail"
LOX_EWOK = "<b>ew_ok is not a failure flag.</b> The field is 1 in every answer that carries data and never becomes 0: during a failure no answer with data arrives, and Loxone keeps the 1. It stays so that no existing search pattern breaks."
LOX_SUCHTEXT = "Search pattern"
LOX_SUCHTEXT_HILFE = "The search patterns belong in the commands of the state container (live.php?status=1). The shorter form %s matches as well, because every field name occurs exactly once in the line."
LOX_TIMEOUT = "Timeout in the container: at least <b>%d ms</b>. For one request the switch works at most %d s on both addresses together (twice the timeout of %d s, at most %d s), and one second is added for the way. Loxone accepts at most %d ms as the timeout of a container; that is why the timeout per address is limited to %d s. With a lower timeout Loxone gives up before the fallback address could answer: the container goes offline although the switch would have changed over."
